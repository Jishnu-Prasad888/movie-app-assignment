# Yozigo — local stack: PostgreSQL + Go API + React frontend (served by nginx).
#   docker compose up --build        start everything  -> http://localhost:3000
#   docker compose down -v           stop and DELETE the database volume (full reset)
#   docker compose --profile test run --rm backend-tests   run the Go test suite in Docker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yozigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yozigo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-yozigo}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-yozigo}:${POSTGRES_PASSWORD:-yozigo_dev_password}@db:5432/${POSTGRES_DB:-yozigo}?sslmode=disable
      PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      CINEMA_TIMEZONE: ${CINEMA_TIMEZONE:-Asia/Kolkata}
      SEED_ON_START: ${SEED_ON_START:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Off unless explicitly enabled in .env
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-yozigo-demo}
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-3000}:80"
    restart: unless-stopped

  # Runs `go test ./...` (unit + PostgreSQL integration tests) against the yozigo_test database.
  backend-tests:
    profiles: ["test"]
    image: golang:1.27-alpine
    working_dir: /src
    volumes:
      - ./backend:/src
      - gocache:/root/go
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-yozigo}:${POSTGRES_PASSWORD:-yozigo_dev_password}@db:5432/yozigo_test?sslmode=disable
      CGO_ENABLED: "0"
    depends_on:
      db:
        condition: service_healthy
    command: ["go", "test", "-count=1", "./..."]

volumes:
  pgdata:
  gocache:
