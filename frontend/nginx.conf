server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API requests go to the Go service. Same origin for the browser, so the HttpOnly
    # session cookie is first-party and no CORS is needed.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed static assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
